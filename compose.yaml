name: college-helper

services:
  college-helper:
    build: .
    env_file:
      - path: .env
        required: true
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
    ports:
      - "127.0.0.1:3100:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      learning-resource-worker:
        condition: service_healthy

  learning-resource-worker:
    build:
      context: .
      dockerfile: Dockerfile.browser-audit
    env_file:
      - path: .env
        required: true
    environment:
      LEARNING_RESOURCE_WORKER_PORT: 3200
      LEARNING_RESOURCE_CACHE_DIR: /data
    command: ["node", "dist/scripts/learning-resource-worker.js"]
    volumes:
      - learning-resource-cache:/data
    ipc: host
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3200/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  canvas-audit:
    build: .
    profiles: ["audit"]
    env_file:
      - path: .env
        required: false
    environment:
      REPORTS_DIR: /app/reports
    command: ["node", "dist/scripts/audit-canvas-api.js"]
    volumes:
      - ./reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  learning-resource-browser-audit:
    build:
      context: .
      dockerfile: Dockerfile.browser-audit
    profiles: ["browser-audit"]
    env_file:
      - path: .env
        required: true
    environment:
      AUDIT_MAX_COURSES: 1
      AUDIT_COURSE_ID: ${AUDIT_COURSE_ID:-}
    ipc: host
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  learning-resource-cache:
